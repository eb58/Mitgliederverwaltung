services:
  web:
    volumes:
      - ../../Mitgliederverwaltung/server/apache-local.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./src/mitgliederverwaltung:/var/www/html/mitgliederverwaltung
      - ../../Mitgliederverwaltung/server:/var/www/html/mitgliederverwaltung/php-api
    environment:
      MEMBER_DB_HOST: db
      MEMBER_DB_PORT: 3306
      MEMBER_DB_NAME: mitgliederverwaltung
      MEMBER_DB_USER: mitglieder
      MEMBER_DB_PASSWORD: mitglieder-local
      MEMBER_API_CORS_ORIGIN: http://localhost
