# Wegwerf-Datenbank fuer die PHP-Integrationstests.
# Start: npm run test:php:db:up   |  Stop: npm run test:php:db:down
# Laeuft auf tmpfs, ueberlebt einen Neustart also bewusst nicht.
services:
  db:
    image: mariadb:latest
    container_name: mv-test-db
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: mitgliederverwaltung_test
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Bewusst ueber TCP statt healthcheck.sh: waehrend der Erstinitialisierung
      # laeuft ein temporaerer Server, der nur den Socket bedient und danach
      # durchgestartet wird. Ueber den Socket meldete der Container "healthy",
      # und das Schema landete in einer gleich darauf verworfenen Instanz.
      test: ["CMD", "mariadb", "-h", "127.0.0.1", "-uroot", "-ptest", "-e", "SELECT 1", "mitgliederverwaltung_test"]
      interval: 2s
      timeout: 3s
      retries: 40
